<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You? 🥂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #fbf3ec;
    --blush: #eeddd6;
    --rose-dust: #c98a93;
    --wine: #6b2737;
    --wine-2: #8c3f4d;
    --gold: #c9a24b;
    --gold-soft: #e4c98f;
    --ink: #3b2126;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: linear-gradient(160deg, var(--ivory), var(--blush) 55%, var(--rose-dust) 130%);
    background-size: 220% 220%;
    animation: driftGradient 22s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    min-height: 100vh;
    position: relative;
    padding: 20px;
  }

  @keyframes driftGradient {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 60%; }
  }

  /* Floating background petals */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .bg-heart {
    position: absolute;
    bottom: -50px;
    font-size: 20px;
    opacity: 0.45;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.5;
    }
    100% {
      transform: translateY(-110vh) rotate(200deg);
      opacity: 0;
    }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 250, 245, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 44px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(107, 39, 55, 0.18), inset 0 0 0 1px rgba(201, 162, 75, 0.35);
    animation: popIn 0.8s cubic-bezier(.22,1,.36,1);
  }

  @keyframes popIn {
    0% { transform: scale(0.92) translateY(18px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .emoji-top {
    font-size: 46px;
    display: inline-block;
    animation: breathe 3.4s ease-in-out infinite;
    margin-bottom: 14px;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.92; }
    50% { transform: scale(1.06); opacity: 1; }
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 1.75rem;
    color: var(--wine);
    margin-bottom: 12px;
    line-height: 1.3;
    text-wrap: balance;
  }

  p.subtitle {
    color: var(--rose-dust);
    font-size: 1.05rem;
    font-style: italic;
    margin-bottom: 8px;
    min-height: 1.4em;
  }

  .button-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 64px;
    margin-top: 24px;
  }

  button {
    border: none;
    border-radius: 999px;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 15px 36px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  #yesBtn {
    background: linear-gradient(135deg, var(--wine), var(--wine-2));
    color: var(--ivory);
    box-shadow: 0 10px 25px rgba(107, 39, 55, 0.35);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }

  #yesBtn:active {
    transform: scale(0.94);
  }

  #yesBtn.grow {
    box-shadow: 0 14px 32px rgba(201, 162, 75, 0.4);
  }

  #noBtn {
    background: linear-gradient(135deg, #ddb3ba, var(--rose-dust));
    color: var(--ivory);
    box-shadow: 0 8px 20px rgba(201, 138, 147, 0.35);
    position: relative;
    z-index: 2;
  }

  #noBtn.fixed-fly {
    position: fixed;
    transition: top 0.2s ease, left 0.2s ease, transform 0.2s ease;
  }

  /* Success screen */
  .success-screen {
    display: none;
    position: relative;
    z-index: 1;
    text-align: center;
    animation: popIn 0.7s cubic-bezier(.22,1,.36,1);
  }

  .success-screen.show {
    display: block;
  }

  .success-screen .big-emoji {
    font-size: 62px;
    animation: toast 2.6s ease-in-out infinite;
    display: inline-block;
  }

  @keyframes toast {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .success-screen h1 {
    margin-top: 12px;
  }

  .success-screen p {
    color: var(--ink);
    font-size: 1.1rem;
    margin-top: 12px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }

  .plan-form {
    margin-top: 28px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .plan-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .plan-field label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--wine);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .plan-field input {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.05rem;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(107, 39, 55, 0.25);
    background: rgba(255, 255, 255, 0.65);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .plan-field input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(201, 162, 75, 0.18);
  }

  #confirmPlanBtn {
    margin-top: 4px;
    align-self: center;
    background: linear-gradient(135deg, var(--wine), var(--wine-2));
    color: var(--ivory);
    box-shadow: 0 10px 25px rgba(107, 39, 55, 0.35);
  }

  #confirmPlanBtn:active {
    transform: scale(0.95);
  }

  .plan-confirmed {
    display: none;
    margin-top: 26px;
    padding: 20px 22px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 16px;
    box-shadow: inset 0 0 0 1px rgba(201, 162, 75, 0.35);
    color: var(--ink);
    font-size: 1.08rem;
    line-height: 1.6;
  }

  .signature {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
    font-size: 0.9rem;
    font-style: italic;
    color: var(--ivory);
    text-shadow: 0 1px 6px rgba(59, 33, 38, 0.4);
    letter-spacing: 0.3px;
    pointer-events: none;
  }

  /* Confetti canvas */
  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  @media (max-width: 380px) {
    h1 { font-size: 1.5rem; }
    button { padding: 13px 28px; font-size: 1.05rem; }
    .card { padding: 34px 22px; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<canvas id="confettiCanvas"></canvas>

<div class="card" id="questionCard">
  <div class="emoji-top">🌹</div>
  <h1>Will you go out with me?</h1>
  <p class="subtitle" id="subtitle"></p>
  <div class="button-row">
    <button id="yesBtn" onclick="sayYes()">Yes 🥂</button>
    <button id="noBtn" onclick="dodge()">No</button>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="big-emoji">🥂</div>
  <h1>I knew you couldn't resist!</h1>
  <p>Best decision you've ever made. See you soon!</p>

  <div class="plan-form" id="planForm">
    <div class="plan-field">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">
    </div>
    <div class="plan-field">
      <label for="timeInput">Time</label>
      <input type="time" id="timeInput">
    </div>
    <div class="plan-field">
      <label for="activityInput">What shall we do?</label>
      <input type="text" id="activityInput" placeholder="e.g. Drinks at a bar">
    </div>
    <button id="confirmPlanBtn" onclick="confirmPlan()">Confirm our plan</button>
  </div>

  <div class="plan-confirmed" id="planConfirmed">
    <p id="planConfirmedText"></p>
  </div>
</div>

<div class="signature">Custom coded by Ofir</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const questionCard = document.getElementById('questionCard');
  const successScreen = document.getElementById('successScreen');
  const bgHearts = document.getElementById('bgHearts');
  const planForm = document.getElementById('planForm');
  const planConfirmed = document.getElementById('planConfirmed');
  const planConfirmedText = document.getElementById('planConfirmedText');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const activityInput = document.getElementById('activityInput');
  const subtitle = document.getElementById('subtitle');

  let dodgeCount = 0;
  const noPhrases = ["No", "Not yet", "Try again", "So close", "Patience...", "Almost", "Keep trying", "Not quite", "I'm worth it", "Catch me first"];

  // Escalating commentary as the attempts pile up — picked by threshold
  // rather than one message per count so it still makes sense past 20 tries.
  function updateTeaseSubtitle() {
    const n = dodgeCount;
    let msg;
    if (n < 3) msg = `A lovely attempt — but "no" is still shy.`;
    else if (n < 6) msg = `Attempt #${n}. Persistence suits you.`;
    else if (n < 10) msg = `#${n} tries — the chase is half the charm.`;
    else if (n < 15) msg = `Still going? Patience is a virtue, darling.`;
    else msg = `${n} attempts... perhaps it's simply meant to be "yes."`;
    subtitle.textContent = msg;
  }

  function moveButtonAway() {
    if (!noBtn.classList.contains('fixed-fly')) {
      // .card has a permanent backdrop-filter, which per spec makes it the
      // containing block for any position:fixed descendant — so the button
      // would be positioned relative to the (smaller, offset) card box
      // instead of the real viewport. Reparent it to <body> first so our
      // viewport-relative math below is actually correct.
      document.body.appendChild(noBtn);
      noBtn.classList.add('fixed-fly');
    }

    // Update the label first so the width/height used below reflects the
    // text that will actually be showing (phrases vary a lot in length,
    // e.g. "No" vs "Catch me first" — sizing off the old text could push
    // the button past the edge of the screen).
    dodgeCount++;
    noBtn.textContent = noPhrases[(dodgeCount - 1) % noPhrases.length];
    updateTeaseSubtitle();

    // A short buzz sells the "almost got it" feeling on phones (no-op
    // silently where Vibration API isn't supported, e.g. iOS Safari/desktop).
    if (navigator.vibrate) navigator.vibrate(35);

    const margin = 12;
    const btnRect = noBtn.getBoundingClientRect();
    // Assume a generous worst-case size (the widest phrase, e.g. "Catch me
    // first") rather than trusting this instant's measurement alone — glyph
    // rendering can finish a beat after the text is set, quietly growing the
    // button past a bound sized for the old width.
    const w = Math.max(btnRect.width, 220);
    const h = Math.max(btnRect.height, 70);

    const maxX = Math.max(margin, window.innerWidth - w - margin);
    const maxY = Math.max(margin, window.innerHeight - h - margin);

    const newX = Math.min(maxX, Math.max(margin, Math.random() * maxX));
    const newY = Math.min(maxY, Math.max(margin, Math.random() * maxY));

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    // The "No" button shrinks a little more with every failed attempt,
    // floored so it never gets too small to tap at all.
    const noScale = Math.max(0.55, 1 - dodgeCount * 0.025);
    noBtn.style.transform = `scale(${noScale})`;

    // Yes button grows a bit each time to encourage the inevitable
    const scale = Math.min(1.5, 1 + dodgeCount * 0.05);
    yesBtn.style.transform = `scale(${scale})`;
    yesBtn.classList.add('grow');
  }

  function dodge() {
    moveButtonAway();
  }

  // Desktop: run away on hover too (delayed so the card's entrance animation
  // sweeping the button under an already-resting cursor doesn't trigger a
  // spurious mouseenter before the user actually interacts)
  let hoverDodgeEnabled = false;
  setTimeout(() => { hoverDodgeEnabled = true; }, 800);

  noBtn.addEventListener('mouseenter', function () {
    if (hoverDodgeEnabled) moveButtonAway();
  });
  noBtn.addEventListener('touchstart', function (e) {
    e.preventDefault();
    moveButtonAway();
  }, { passive: false });

  function sayYes() {
    questionCard.style.display = 'none';
    // If she's dodged at least once, noBtn was reparented to <body> (see
    // moveButtonAway) to escape .card's backdrop-filter containing block —
    // so it's no longer inside questionCard and hiding that div alone
    // doesn't hide it anymore. Hide it explicitly too.
    noBtn.style.display = 'none';
    successScreen.classList.add('show');
    launchConfetti();
    notifyYes();
    setDefaultPlan();
  }

  // Default plan: tomorrow, 20:00, a bar — she can change any of it before
  // locking it in.
  function getDefaultDateStr() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function setDefaultPlan() {
    dateInput.value = getDefaultDateStr();
    timeInput.value = '20:00';
    activityInput.value = 'Drinks at a bar';
  }

  function formatDateForDisplay(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long' });
  }

  function confirmPlan() {
    // Fields default to tomorrow/20:00/bar already, but guard against her
    // clearing one and hitting the button anyway.
    if (!dateInput.value) dateInput.value = getDefaultDateStr();
    if (!timeInput.value) timeInput.value = '20:00';
    if (!activityInput.value.trim()) activityInput.value = 'Drinks at a bar';

    const niceDate = formatDateForDisplay(dateInput.value);
    const timeVal = timeInput.value;
    const activityVal = activityInput.value.trim();

    fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
      method: 'POST',
      body: `Plan locked in! 📅 ${niceDate} at ${timeVal} — ${activityVal}`
    }).catch(() => {});

    planForm.style.display = 'none';
    planConfirmedText.textContent = `${niceDate}, ${timeVal}. ${activityVal}. Wear something nice.`;
    planConfirmed.style.display = 'block';
  }

  // Push a notification via ntfy.sh so a phone subscribed to this topic
  // finds out the moment she says yes. Fire-and-forget: a failed/blocked
  // request should never break the celebration for her.
  //
  // No custom headers here on purpose: a Title/Tags header turns this into
  // a "non-simple" CORS request, which forces the browser to send an OPTIONS
  // preflight first — exactly the kind of request some mobile browsers,
  // in-app browsers (WhatsApp/Instagram), and ad/privacy blockers silently
  // drop. A plain text/plain POST body needs no preflight at all.
  const NTFY_TOPIC = 'ofir-date-yes-ea3b72707d10';
  function notifyYes() {
    fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
      method: 'POST',
      body: 'She said yes! 🥂 Time to plan the date.'
    }).catch(() => {});
  }

  // Floating background petals
  function createFloatingHearts() {
    const emojis = ['🌹', '💐', '🤍', '💌'];
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (14 + Math.random() * 16) + 'px';
      const duration = 9 + Math.random() * 7;
      heart.style.animationDuration = duration + 's';
      bgHearts.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }, 1200);
  }
  createFloatingHearts();

  // Confetti — soft gold/wine/blush petals rather than rainbow party confetti
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiAnimationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function makePiece(colors, startAboveScreen) {
    return {
      x: Math.random() * canvas.width,
      y: startAboveScreen ? -20 - Math.random() * canvas.height * 0.5 : -20,
      w: 7 + Math.random() * 7,
      h: 11 + Math.random() * 9,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 5,
      speedY: 1.2 + Math.random() * 2,
      speedX: (Math.random() - 0.5) * 1.4
    };
  }

  function launchConfetti() {
    const colors = ['#c9a24b', '#6b2737', '#c98a93', '#eeddd6', '#8c3f4d', '#e4c98f'];
    confettiPieces = [];
    const count = 90;

    for (let i = 0; i < count; i++) {
      confettiPieces.push(makePiece(colors, true));
    }

    if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
    animateConfetti();

    // keep sprinkling a bit more for a few seconds
    let bursts = 0;
    const burstInterval = setInterval(() => {
      bursts++;
      for (let i = 0; i < 25; i++) {
        confettiPieces.push(makePiece(colors, false));
      }
      if (!confettiAnimationId) animateConfetti();
      if (bursts >= 4) clearInterval(burstInterval);
    }, 700);
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confettiPieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 30);

    if (confettiPieces.length > 0) {
      confettiAnimationId = requestAnimationFrame(animateConfetti);
    } else {
      confettiAnimationId = null;
    }
  }
</script>

</body>
</html>
