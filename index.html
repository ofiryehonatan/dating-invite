<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Will You? 💌</title>
<style>
  :root {
    --pink-1: #ff9a9e;
    --pink-2: #fecfef;
    --pink-3: #ffdde1;
    --heart: #ff477e;
    --yes-1: #6a11cb;
    --yes-2: #2575fc;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(-45deg, var(--pink-1), var(--pink-2), var(--pink-3), #ffb6c1);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    min-height: 100vh;
    position: relative;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating background hearts */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .bg-heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    opacity: 0.6;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.7;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 40px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(255, 71, 126, 0.25), inset 0 0 0 1px rgba(255,255,255,0.4);
    animation: popIn 0.7s cubic-bezier(.26,1.4,.5,1);
  }

  @keyframes popIn {
    0% { transform: scale(0.7) translateY(30px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .emoji-top {
    font-size: 54px;
    display: inline-block;
    animation: wiggle 2.2s ease-in-out infinite;
    margin-bottom: 10px;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  h1 {
    font-size: 1.6rem;
    color: #d6336c;
    margin-bottom: 10px;
    line-height: 1.35;
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
  }

  p.subtitle {
    color: #a5335a;
    font-size: 0.95rem;
    margin-bottom: 30px;
    opacity: 0.85;
  }

  .button-row {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 64px;
  }

  button {
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 16px 34px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
  }

  #yesBtn {
    background: linear-gradient(135deg, var(--yes-1), var(--yes-2));
    color: #fff;
    box-shadow: 0 10px 25px rgba(37, 117, 252, 0.4);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
  }

  #yesBtn:active {
    transform: scale(0.93);
  }

  #yesBtn.grow {
    transform: scale(1.15);
    box-shadow: 0 14px 34px rgba(37, 117, 252, 0.55);
  }

  #noBtn {
    background: linear-gradient(135deg, #ff8a8a, #ff5c8a);
    color: #fff;
    box-shadow: 0 8px 20px rgba(255, 92, 138, 0.4);
    position: relative;
    z-index: 2;
  }

  #noBtn.fixed-fly {
    position: fixed;
    transition: top 0.18s ease, left 0.18s ease, transform 0.18s ease;
  }

  /* Success screen */
  .success-screen {
    display: none;
    position: relative;
    z-index: 1;
    text-align: center;
    animation: popIn 0.6s cubic-bezier(.26,1.4,.5,1);
  }

  .success-screen.show {
    display: block;
  }

  .success-screen .big-emoji {
    font-size: 70px;
    animation: bounce 1s ease infinite;
    display: inline-block;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  .success-screen h1 {
    font-size: 1.8rem;
    margin-top: 10px;
  }

  .success-screen p {
    color: #a5335a;
    font-size: 1.05rem;
    margin-top: 14px;
    max-width: 380px;
  }

  .plan-form {
    margin-top: 26px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .plan-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .plan-field label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #a5335a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .plan-field input {
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid rgba(214, 51, 108, 0.25);
    background: rgba(255, 255, 255, 0.7);
    color: #6b1d3a;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .plan-field input:focus {
    border-color: var(--heart);
    box-shadow: 0 0 0 4px rgba(255, 71, 126, 0.15);
  }

  #confirmPlanBtn {
    margin-top: 4px;
    align-self: center;
    background: linear-gradient(135deg, var(--yes-1), var(--yes-2));
    color: #fff;
    box-shadow: 0 10px 25px rgba(37, 117, 252, 0.4);
  }

  #confirmPlanBtn:active {
    transform: scale(0.95);
  }

  .plan-confirmed {
    display: none;
    margin-top: 24px;
    padding: 18px 20px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 18px;
    color: #6b1d3a;
    font-weight: 600;
    line-height: 1.5;
  }

  .signature {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
    font-size: 0.85rem;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    letter-spacing: 0.3px;
    font-weight: 600;
    pointer-events: none;
  }

  /* Confetti canvas */
  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  @media (max-width: 380px) {
    h1 { font-size: 1.35rem; }
    button { padding: 14px 26px; font-size: 1rem; }
    .card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<canvas id="confettiCanvas"></canvas>

<div class="card" id="questionCard">
  <div class="emoji-top">💘</div>
  <h1>Hey you... would you like to go out with me? 👀</h1>
  <p class="subtitle" id="subtitle">Take your time. (But the "No" button is a little shy 😉)</p>
  <div class="button-row">
    <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button id="noBtn" onclick="dodge()">No</button>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="big-emoji">🎉</div>
  <h1>I knew you couldn't resist!</h1>
  <p>Best decision you've made today. See you soon!</p>

  <div class="plan-form" id="planForm">
    <div class="plan-field">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">
    </div>
    <div class="plan-field">
      <label for="timeInput">Time</label>
      <input type="time" id="timeInput">
    </div>
    <div class="plan-field">
      <label for="activityInput">What should we do?</label>
      <input type="text" id="activityInput" placeholder="e.g. Drinks at a bar">
    </div>
    <button id="confirmPlanBtn" onclick="confirmPlan()">Lock it in 💌</button>
  </div>

  <div class="plan-confirmed" id="planConfirmed">
    <p id="planConfirmedText"></p>
  </div>
</div>

<div class="signature">Custom coded by Ofir 😉</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const questionCard = document.getElementById('questionCard');
  const successScreen = document.getElementById('successScreen');
  const bgHearts = document.getElementById('bgHearts');
  const planForm = document.getElementById('planForm');
  const planConfirmed = document.getElementById('planConfirmed');
  const planConfirmedText = document.getElementById('planConfirmedText');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const activityInput = document.getElementById('activityInput');
  const subtitle = document.getElementById('subtitle');

  let dodgeCount = 0;
  const noPhrases = ["No", "Nope!", "Try again", "Nuh-uh", "Nice try", "Almost!", "So close", "Are you sure?", "Really?", "Think again 😏"];

  // Escalating commentary as the attempts pile up — picked by threshold
  // rather than one message per count so it still makes sense past 20 tries.
  function updateTeaseSubtitle() {
    const n = dodgeCount;
    let msg;
    if (n < 3) msg = `Nice try (attempt #${n}) — it's just warming up 😏`;
    else if (n < 6) msg = `Attempt #${n}. The "No" button does not consent 🙅`;
    else if (n < 10) msg = `#${n} tries. This is basically cardio now 🏃‍♀️`;
    else if (n < 15) msg = `#${n}! Respect the persistence, but it's still shy 🙈`;
    else msg = `${n} attempts?! At this point just say yes already 😌`;
    subtitle.textContent = msg;
  }

  function moveButtonAway() {
    if (!noBtn.classList.contains('fixed-fly')) {
      // .card has a permanent backdrop-filter, which per spec makes it the
      // containing block for any position:fixed descendant — so the button
      // would be positioned relative to the (smaller, offset) card box
      // instead of the real viewport. Reparent it to <body> first so our
      // viewport-relative math below is actually correct.
      document.body.appendChild(noBtn);
      noBtn.classList.add('fixed-fly');
    }

    // Update the label first so the width/height used below reflects the
    // text that will actually be showing (phrases vary a lot in length,
    // e.g. "No" vs "Are you sure?" — sizing off the old text could push
    // the button past the edge of the screen).
    dodgeCount++;
    noBtn.textContent = noPhrases[(dodgeCount - 1) % noPhrases.length];
    updateTeaseSubtitle();

    // A short buzz sells the "almost got it" feeling on phones (no-op
    // silently where Vibration API isn't supported, e.g. iOS Safari/desktop).
    if (navigator.vibrate) navigator.vibrate(35);

    const margin = 12;
    const btnRect = noBtn.getBoundingClientRect();
    // Assume a generous worst-case size (the widest phrase, e.g. "Think
    // again 😏") rather than trusting this instant's measurement alone —
    // emoji glyphs can finish rendering a beat after the text is set,
    // quietly growing the button past a bound sized for the old width.
    const w = Math.max(btnRect.width, 220);
    const h = Math.max(btnRect.height, 70);

    const maxX = Math.max(margin, window.innerWidth - w - margin);
    const maxY = Math.max(margin, window.innerHeight - h - margin);

    const newX = Math.min(maxX, Math.max(margin, Math.random() * maxX));
    const newY = Math.min(maxY, Math.max(margin, Math.random() * maxY));

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    // The "No" button shrinks a little more with every failed attempt,
    // floored so it never gets too small to tap at all.
    const noScale = Math.max(0.55, 1 - dodgeCount * 0.025);
    noBtn.style.transform = `scale(${noScale})`;

    // Yes button grows a bit each time to encourage the inevitable
    const scale = Math.min(1.5, 1 + dodgeCount * 0.05);
    yesBtn.style.transform = `scale(${scale})`;
    yesBtn.classList.add('grow');
  }

  function dodge() {
    moveButtonAway();
  }

  // Desktop: run away on hover too (delayed so the card's entrance animation
  // sweeping the button under an already-resting cursor doesn't trigger a
  // spurious mouseenter before the user actually interacts)
  let hoverDodgeEnabled = false;
  setTimeout(() => { hoverDodgeEnabled = true; }, 800);

  noBtn.addEventListener('mouseenter', function () {
    if (hoverDodgeEnabled) moveButtonAway();
  });
  noBtn.addEventListener('touchstart', function (e) {
    e.preventDefault();
    moveButtonAway();
  }, { passive: false });

  function sayYes() {
    questionCard.style.display = 'none';
    successScreen.classList.add('show');
    launchConfetti();
    notifyYes();
    setDefaultPlan();
  }

  // Default plan: tomorrow, 20:00, a bar — she can change any of it before
  // locking it in.
  function getDefaultDateStr() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function setDefaultPlan() {
    dateInput.value = getDefaultDateStr();
    timeInput.value = '20:00';
    activityInput.value = 'Drinks at a bar';
  }

  function formatDateForDisplay(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }

  function confirmPlan() {
    // Fields default to tomorrow/20:00/bar already, but guard against her
    // clearing one and hitting the button anyway.
    if (!dateInput.value) dateInput.value = getDefaultDateStr();
    if (!timeInput.value) timeInput.value = '20:00';
    if (!activityInput.value.trim()) activityInput.value = 'Drinks at a bar';

    const niceDate = formatDateForDisplay(dateInput.value);
    const timeVal = timeInput.value;
    const activityVal = activityInput.value.trim();

    fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
      method: 'POST',
      body: `Plan locked in! 📅 ${niceDate} at ${timeVal} — ${activityVal}`
    }).catch(() => {});

    planForm.style.display = 'none';
    planConfirmedText.textContent = `It's set — ${niceDate} at ${timeVal}, ${activityVal}. Can't wait 💕`;
    planConfirmed.style.display = 'block';
  }

  // Push a notification via ntfy.sh so a phone subscribed to this topic
  // finds out the moment she says yes. Fire-and-forget: a failed/blocked
  // request should never break the celebration for her.
  //
  // No custom headers here on purpose: a Title/Tags header turns this into
  // a "non-simple" CORS request, which forces the browser to send an OPTIONS
  // preflight first — exactly the kind of request some mobile browsers,
  // in-app browsers (WhatsApp/Instagram), and ad/privacy blockers silently
  // drop. A plain text/plain POST body needs no preflight at all.
  const NTFY_TOPIC = 'ofir-date-yes-ea3b72707d10';
  function notifyYes() {
    fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
      method: 'POST',
      body: 'She said yes! 🎉 She said YES! 💖 Time to plan the date.'
    }).catch(() => {});
  }

  // Floating background hearts
  function createFloatingHearts() {
    const emojis = ['💕', '💖', '💗', '💓', '💞', '❤️'];
    setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (16 + Math.random() * 22) + 'px';
      const duration = 6 + Math.random() * 6;
      heart.style.animationDuration = duration + 's';
      bgHearts.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }, 500);
  }
  createFloatingHearts();

  // Confetti
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiAnimationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchConfetti() {
    const colors = ['#ff477e', '#ff8a8a', '#ffd93d', '#6a11cb', '#2575fc', '#ff5c8a', '#fecfef'];
    confettiPieces = [];
    const count = 160;

    for (let i = 0; i < count; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 10,
        speedY: 2 + Math.random() * 3.5,
        speedX: (Math.random() - 0.5) * 2.5,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }

    if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
    animateConfetti();

    // keep sprinkling a bit more for a few seconds
    let bursts = 0;
    const burstInterval = setInterval(() => {
      bursts++;
      for (let i = 0; i < 40; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: -20,
          w: 6 + Math.random() * 6,
          h: 10 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          speedY: 2 + Math.random() * 3.5,
          speedX: (Math.random() - 0.5) * 2.5,
          shape: Math.random() > 0.5 ? 'rect' : 'circle'
        });
      }
      if (!confettiAnimationId) animateConfetti();
      if (bursts >= 4) clearInterval(burstInterval);
    }, 700);
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confettiPieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });

    confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 30);

    if (confettiPieces.length > 0) {
      confettiAnimationId = requestAnimationFrame(animateConfetti);
    } else {
      confettiAnimationId = null;
    }
  }
</script>

</body>
</html>
